<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RappiYa - Crear cuenta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Crear una cuenta</h1>
    </header>
    <main>
        <div class="form">
            <!-- novalidate apaga los popups nativos del navegador -->
            <form id="registroForm" novalidate>
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre">
                <span class="error-msg" id="error-nombre"></span>

                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="Ingrese su correo electrónico">
                <span class="error-msg" id="error-email"></span>

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres, mayúscula y número">
                <span class="error-msg" id="error-password"></span>

                <label for="confirmPassword">Confirmar contraseña</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repita su contraseña">
                <span class="error-msg" id="error-confirmPassword"></span>

                <p id="mensaje"></p>

                <button type="submit">Crear cuenta</button>
            </form>
        </div>
        <div class="account-link">
            <span>¿Ya tenés una cuenta?</span>
            <a href="index.html">Iniciar sesión</a>
        </div>
    </main>
    <footer></footer>
    <script src="registro.js"></script>
</body>
</html>
