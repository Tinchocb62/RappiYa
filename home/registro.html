
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RappiYa - Crear cuenta</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <header>

        <h1>Crear una cuenta</h1>

    </header>


    <main>


        <div class="form">

            <form id="registroForm">


                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ingrese su nombre"
                    required
                >


                <label for="email">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Ingrese su correo electrónico"
                    required
                >


                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingrese su contraseña"
                    required
                >


                <label for="confirmPassword">
                    Confirmar contraseña
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Repita su contraseña"
                    required
                >


                <p id="mensaje"></p>


                <button type="submit">
                    Crear cuenta
                </button>


            </form>

        </div>


        <div class="account-link">

            <span>
                ¿Ya tienes una cuenta?
            </span>

            <a href="index.html">
                Iniciar sesión
            </a>

        </div>


    </main>


    <footer></footer>


    <script src="registro.js"></script>


</body>

</html>
