<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RappiYa - Restablecer contraseña</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Restablecer contraseña</h1>
    </header>
    <main>
        <div class="form">
            <form id="restablecerForm" novalidate>
                <label for="password">Nueva contraseña</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres, mayúscula y número">
                <span class="error-msg" id="error-password"></span>

                <label for="confirmPassword">Confirmar contraseña</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repita la nueva contraseña">
                <span class="error-msg" id="error-confirmPassword"></span>

                <p id="mensaje"></p>

                <button type="submit" id="btnCambiar">Cambiar contraseña</button>
            </form>
        </div>
        <div class="account-link">
            <a href="index.html">Volver al inicio de sesión</a>
        </div>
    </main>
    <footer></footer>

    <script src="js/api.js"></script>
<script>
        const formulario = document.getElementById("restablecerForm");
        const mensajeGeneral = document.getElementById("mensaje");
        const btnCambiar = document.getElementById("btnCambiar");

        const inputPassword = document.getElementById("password");
        const inputConfirmPassword = document.getElementById("confirmPassword");

        const errorPassword = document.getElementById("error-password");
        const errorConfirmPassword = document.getElementById("error-confirmPassword");

        function mostrarError(input, span, texto) {
            input.classList.add("input-error");
            span.textContent = texto;
            span.classList.add("activo");
        }

        function limpiarError(input, span) {
            input.classList.remove("input-error");
            span.textContent = "";
            span.classList.remove("activo");
        }

        inputPassword.addEventListener("input", () => limpiarError(inputPassword, errorPassword));
        inputConfirmPassword.addEventListener("input", () => limpiarError(inputConfirmPassword, errorConfirmPassword));

        const parametros = new URLSearchParams(window.location.search);
        const token = parametros.get("token");
        let enlaceValido = false;
        btnCambiar.disabled = true;

        if (!token) {
            mensajeGeneral.className = "error";
            mensajeGeneral.textContent = "Enlace inválido o código no encontrado.";
            btnCambiar.disabled = true;
        } else {
            mensajeGeneral.textContent = "Verificando enlace...";
            apiFetch(`${window.RAPPIYA_API}/restablecer/validar`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token })
            }).then(async (respuesta) => {
                const datos = await respuesta.json();
                enlaceValido = respuesta.ok && datos.success;
                btnCambiar.disabled = !enlaceValido;
                mensajeGeneral.className = enlaceValido ? "" : "error";
                mensajeGeneral.textContent = enlaceValido ? "" : datos.message;
                if (!enlaceValido) {
                    const enlace = document.createElement("a");
                    enlace.href = "recuperarpass.html";
                    enlace.textContent = "Solicitar un enlace nuevo";
                    mensajeGeneral.after(enlace);
                }
            }).catch(() => {
                mensajeGeneral.className = "error";
                mensajeGeneral.textContent = "No se pudo verificar el enlace. Revisá la conexión y recargá la página.";
            });
        }

        formulario.addEventListener("submit", async (event) => {
            event.preventDefault();
            if (!enlaceValido) return;
            mensajeGeneral.textContent = "";
            mensajeGeneral.className = "";

            let hayErrores = false;
            const pass = inputPassword.value;

            if (pass === "") {
                mostrarError(inputPassword, errorPassword, "La contraseña es obligatoria");
                hayErrores = true;
            } else if (pass.length < 8) {
                mostrarError(inputPassword, errorPassword, "Debe tener al menos 8 caracteres");
                hayErrores = true;
            } else if (!/[A-Z]/.test(pass)) {
                mostrarError(inputPassword, errorPassword, "Debe incluir al menos una mayúscula");
                hayErrores = true;
            } else if (!/[0-9]/.test(pass)) {
                mostrarError(inputPassword, errorPassword, "Debe incluir al menos un número");
                hayErrores = true;
            }

            if (inputConfirmPassword.value === "") {
                mostrarError(inputConfirmPassword, errorConfirmPassword, "Repetí tu nueva contraseña");
                hayErrores = true;
            } else if (pass !== inputConfirmPassword.value) {
                mostrarError(inputConfirmPassword, errorConfirmPassword, "Las contraseñas no coinciden");
                hayErrores = true;
            }

            if (hayErrores) return;

            try {
                const respuesta = await apiFetch(`${window.RAPPIYA_API}/restablecer`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token: token, password: pass })
                });

                const datos = await respuesta.json();

                if (datos.success) {
                    mensajeGeneral.className = "exito";
                    mensajeGeneral.textContent = "¡Contraseña actualizada con éxito! Redirigiendo...";
                    formulario.reset();
                    btnCambiar.disabled = true;
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 2000);
                } else {
                    mensajeGeneral.className = "error";
                    mensajeGeneral.textContent = datos.message;
                }
            } catch (error) {
                mensajeGeneral.className = "error";
                mensajeGeneral.textContent = "No se pudo conectar con el servidor";
            }
        });
    </script>
</body>
</html>
