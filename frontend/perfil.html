<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RappiYa - Mi perfil</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>

<section class="page">
  <div class="profile-header">
    <div class="avatar" id="avatar">MC</div>
    <div class="profile-heading">
      <h1>Mi perfil</h1>
      <p class="subtitle">Consultá y actualizá tus datos personales de contacto.</p>
    </div>
    <span class="role-badge" id="roleBadge">Rol: Cliente</span>
  </div>

  <div class="form-body">
    <div class="alert alert-success" id="successMessage" hidden>
      <span>✓ Cambios guardados con éxito. La información de tu perfil fue actualizada.</span>
      <button class="alert-close" id="closeSuccess" aria-label="Cerrar">&times;</button>
    </div>

    <form id="profileForm">
      <div class="field">
        <div class="field-label"><label for="name">Nombre completo</label></div>
        <input id="name" required minlength="3">
      </div>

      <div class="field">
        <div class="field-label">
          <label for="email">Correo electrónico</label>
          <span class="locked">🔒 No editable</span>
        </div>
        <input id="email" type="email" readonly>
        <p class="hint">El correo electrónico está vinculado a tu cuenta institucional y no puede modificarse.</p>
      </div>

      <div class="field">
        <div class="field-label"><label for="address">Dirección</label></div>
        <input id="address" required>
      </div>

      <div class="field">
        <div class="field-label"><label for="phone">Teléfono</label></div>
        <input id="phone" type="tel" required>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="cancel">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar cambios</button>
      </div>
    </form>
  </div>
</section>

<script>
const API_URL = "http://localhost:3000";
const $ = id => document.getElementById(id);
let u = JSON.parse(sessionStorage.getItem("usuario") || '{"id":1,"nombre":"Martín Cortez","email":"martin.cortez@rappiya.com","direccion":"Av. Colón 1234, B° Alberdi","telefono":"+54 9 351 555-0192","rol_nombre":"Cliente"}');

function populate() {
  $("name").value = u.nombre || "";
  $("email").value = u.email || "";
  $("address").value = u.direccion || "";
  $("phone").value = u.telefono || "";
  $("roleBadge").textContent = `Rol: ${u.rol_nombre || "Cliente"}`;
}

async function init() {
  try {
    const r = await fetch(`${API_URL}/perfil`, { headers: { "X-User-Id": u.id } });
    const d = await r.json();
    if (d.success) u = d.perfil;
  } catch (e) {}
  populate();
}
init();

$("profileForm").onsubmit = async e => {
  e.preventDefault();
  const nombre = $("name").value.trim();
  const direccion = $("address").value.trim();
  const telefono = $("phone").value.trim();
  const digits = telefono.replace(/\D/g, "");
  if (nombre.length < 3 || !direccion || digits.length < 8 || digits.length > 15) return alert("Revisá los datos ingresados.");

  try {
    const r = await fetch(`${API_URL}/perfil`, {
      method: "PUT",
      headers: { "Content-Type": "application/json", "X-User-Id": u.id },
      body: JSON.stringify({ nombre, direccion, telefono })
    });
    const d = await r.json();
    if (d.success) {
      u = { ...u, nombre, direccion, telefono };
      sessionStorage.setItem("usuario", JSON.stringify(u));
      $("successMessage").hidden = false;
    } else alert(d.message);
  } catch (err) {
    u = { ...u, nombre, direccion, telefono };
    $("successMessage").hidden = false;
  }
};

$("cancel").onclick = populate;
$("closeSuccess").onclick = () => $("successMessage").hidden = true;
</script>
</body>
</html>
